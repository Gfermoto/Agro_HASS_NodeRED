rest_command:
  wfc01_watering_start:
    url: http://192.168.1.105/parse_quick_cmd_iot
    method: POST
    headers:
      Content-Type: "application/json; charset=utf-8"
    payload: >-
      {
        "command": [{
          "cmd": "quick_run",
          "id": 13936,
          "model": 1,
          "on_type": 0,
          "off_type": 0,
          "always_on": 1,
          "on_time": 0,
          "off_time": 0,
          "val_type": 1,
          "val": 0
        }]
      }

  wfc01_watering_stop:
    url: http://192.168.1.105/parse_quick_cmd_iot
    method: POST
    headers:
      Content-Type: "application/json; charset=utf-8"
    payload: >-
      {
        "command": [{
          "cmd": "quick_stop",
          "id": 13936,
          "model": 1
        }]
      }

sensor:
  - platform: rest
    name: "WFC01 Water Temperature"
    resource: http://192.168.1.105/parse_quick_cmd_iot
    method: POST
    payload: '{"command":[{"cmd":"read_device","id":13936,"model":1}]}'
    value_template: "{{ value_json.command[0].water_temp | float }}"
    unit_of_measurement: "°C"
    scan_interval: 60

  - platform: rest
    name: "WFC01 Water Total"
    resource: http://192.168.1.105/parse_quick_cmd_iot
    method: POST
    payload: '{"command":[{"cmd":"read_device","id":13936,"model":1}]}'
    value_template: "{{ value_json.command[0].water_total | float }}"
    unit_of_measurement: "L"
    scan_interval: 60

binary_sensor:
  - platform: rest
    name: "WFC01 Watering Status"
    resource: http://192.168.1.105/parse_quick_cmd_iot
    method: POST
    payload: '{"command":[{"cmd":"read_device","id":13936,"model":1}]}'
    value_template: "{{ value_json.command[0].water_running == 1 }}"
    device_class: running
    scan_interval: 30