# Пример конфигурации системы полива
# Скопируйте этот файл в config.yaml и заполните свои значения

# Настройки контроллера полива
controller:
  ip: "192.168.1.xxx"  # IP-адрес вашего контроллера
  device_id: "13936"   # ID вашего устройства

# Настройки Telegram
telegram:
  bot_token: "YOUR_BOT_TOKEN"
  chat_id: "YOUR_CHAT_ID"

# Настройки погодного API
weather:
  latitude: "55.934"
  longitude: "36.61"

# Настройки полива
watering:
  area: 300  # Площадь газона в м²
  min_volume: 8  # Минимальный объем воды в л/м²
  max_volume: 17  # Максимальный объем воды в л/м²
  max_duration: 120  # Максимальная длительность полива в минутах 