# Данные которые вам понадобятся 

# Настройки контроллера полива
controller:
  ip: "192.168.1.xxx"  # IP-адрес шлюза GW2000A
  device_id: "xxx"   # ID контроллера WFC01 (чувствительные данные)

# Настройки Telegram
telegram:
  bot_token: "YOUR_BOT_TOKEN"  # Токен вашего Telegram бота (чувствительные данные)
  chat_id: "YOUR_CHAT_ID"      # ID чата для уведомлений (чувствительные данные)

# Настройки погодного API
weather:
  latitude: "xx.xxx"   # Широта вашего участка (чувствительные данные)
  longitude: "xx.xxx"   # Долгота вашего участка (чувствительные данные)

# Настройки полива
watering:
  area: 300           # Площадь газона в м²
  min_volume: 8       # Минимальный объем воды в л/м²
  max_volume: 17      # Максимальный объем воды в л/м²
  max_duration: 120   # Максимальная длительность полива в минутах

# Пороговые значения датчиков
sensors:
  soil_moisture:
    min: 30           # Минимальная влажность почвы (%)
    max: 80           # Максимальная влажность почвы (%)
  soil_temperature:
    min: 5            # Минимальная температура почвы (°C)
  uv_index:
    max: 2            # Максимальный UV индекс для полива
  solar_radiation:
    max: 100          # Максимальная солнечная радиация (Вт/м²)
  humidity:
    max: 70           # Максимальная влажность воздуха (%)
  rain:
    threshold: 5      # Порог осадков для отмены полива (мм) 