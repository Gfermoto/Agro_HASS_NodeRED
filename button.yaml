type: custom:button-card
entity: binary_sensor.wfc01_watering_status
show_name: false
show_state: false
styles:
  card:
    - width: 100%
    - height: 90px
    - border-radius: 12px
    - box-shadow: var(--box-shadow)
    - padding: 8px
    - background: var(--card-background-color)
    - margin: 0

custom_fields:
  main: |
    [[[
      const icon = entity.state === 'on' ? 'mdi:stop' : 'mdi:play';
      const color = entity.state === 'on' ? '#ff4444' : '#44ff44';
      return `
        <div style="display:flex;align-items:center;height:100%;gap:15px;">
          <ha-icon 
            icon="${icon}" 
            style="
              color: ${color};
              --mdc-icon-size: 40px;
              flex-shrink: 0;">
          </ha-icon>
          <div style="display:flex;flex-direction:column;gap:6px;flex-grow:1;">
            <div style="display:flex;align-items:center;font-size:16px;">
              <ha-icon 
                icon="mdi:thermometer" 
                style="
                  color: #2196F3;
                  --mdc-icon-size: 24px;
                  margin-right:8px;">
              </ha-icon>
              ${states['sensor.wfc01_water_temperature'].state}°C
            </div>
            <div style="display:flex;align-items:center;font-size:16px;">
              <ha-icon 
                icon="mdi:water" 
                style="
                  color: #00ACC1;
                  --mdc-icon-size: 24px;
                  margin-right:8px;">
              </ha-icon>
              ${states['sensor.wfc01_water_total'].state}L
            </div>
          </div>
        </div>`
    ]]]

tap_action:
  action: call-service
  service: >
    [[[ return entity.state === 'on' 
      ? 'rest_command.wfc01_watering_stop'
      : 'rest_command.wfc01_watering_start' ]]]

state:
  - value: 'on'
    styles:
      card:
        - border: 2px solid #ff4444
  - value: 'off'
    styles:
      card:
        - border: 2px solid #44ff44